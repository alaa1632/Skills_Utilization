name: Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  security:
    name: Security Checks
    runs-on: self-hosted

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create security reports directory
        run: |
          mkdir -p security-reports

      - name: TruffleHog Secret Scan
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            trufflesecurity/trufflehog:latest \
            git file:///repo \
            --results=verified,unknown \
            > security-reports/trufflehog.txt 2>&1

      - name: Bandit Python Security Scan
        continue-on-error: true
        run: |
          python3 -m venv /tmp/security-venv
          /tmp/security-venv/bin/pip install bandit
          /tmp/security-venv/bin/bandit \
            -r ./code \
            -ll \
            -f txt \
            > security-reports/bandit.txt 2>&1

      - name: Hadolint Dockerfile Scan
        continue-on-error: true
        run: |
          docker run --rm -i \
            hadolint/hadolint:latest \
            < ./code/Dockerfile \
            > security-reports/hadolint.txt 2>&1

      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: security-reports/
